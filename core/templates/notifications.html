{% extends "base.html" %}
{% block content %}
<div class="flex justify-between items-center mb-6">
  <h1 class="font-display text-5xl text-ink">Сповіщення</h1>
  <div class="flex gap-2 items-center">
    <a href="?filter=all" class="px-4 py-2 rounded-xl {% if filter_kind == 'all' %}bg-brand-200{% else %}bg-white{% endif %}">Усі</a>
    <a href="?filter=unread" class="px-4 py-2 rounded-xl {% if filter_kind == 'unread' %}bg-brand-200{% else %}bg-white{% endif %}">Непрочитані</a>
    {% if has_any %}
      <form method="post" action="{% url 'notifications_clear' %}" data-confirm="Очистити всі сповіщення?">
        {% csrf_token %}
        <button class="px-4 py-2 rounded-xl bg-danger text-white font-semibold">Очистити все</button>
      </form>
    {% endif %}
  </div>
</div>

<div class="bg-white rounded-2xl shadow-sm p-4 h-[640px] overflow-y-auto chat-scroll max-w-3xl flex flex-col gap-3">
  {% for n in items %}
    <div class="shrink-0 flex items-center gap-4 p-4 rounded-2xl bg-brand-50">
      <span class="w-3 h-3 rounded-full shrink-0
        {% if n.kind == 'limit_over' %}bg-danger{% elif n.kind == 'limit_near' %}bg-warn{% else %}bg-ok{% endif %}"></span>
      <div class="flex-1">
        <p class="font-semibold">{{ n.title }}</p>
        <p class="text-muted text-sm mt-1">{{ n.text }}</p>
      </div>
      <span class="text-muted text-sm">{{ n.created_at|timesince }} тому</span>
    </div>
  {% empty %}
    <p class="text-muted">Сповіщень немає</p>
  {% endfor %}
</div>
{% endblock %}
