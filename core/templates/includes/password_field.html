<div class="flex flex-col">
  {% if field.label %}<label class="text-muted text-sm" for="{{ field.id_for_label }}">{{ field.label }}</label>{% endif %}
  <div class="relative">
    <div class="[&_input]:pr-12 {% if field.errors %}[&_input]:border-2 [&_input]:border-danger{% endif %}">
      {{ field }}
    </div>
    <button type="button" data-eye class="absolute right-3 top-1/2 -translate-y-1/2 text-muted text-sm select-none">👁</button>
  </div>
  {% if field.errors %}<p class="text-danger text-sm mt-1">{{ field.errors|join:' ' }}</p>{% endif %}
</div>
