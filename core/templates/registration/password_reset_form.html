{% extends "auth_base.html" %}
{% block auth_content %}
<h1 class="font-display text-4xl mb-4">Відновлення пароля</h1>
<p class="text-muted mb-6">Введи email, і ми надішлемо посилання для зміни пароля.</p>
<form method="post" class="flex flex-col gap-5">
  {% csrf_token %}
  {% for field in form %}
    {% include "includes/field.html" %}
  {% endfor %}
  <button class="bg-brand-500 text-white rounded-xl py-3 hover:bg-brand-900">Надіслати посилання</button>
</form>
<p class="text-center mt-6 text-muted">
  <a href="{% url 'login' %}" class="text-brand-500">Повернутися до входу</a>
</p>
{% endblock %}
